name: Test Interpreter

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Interpreter Tests
        run: python main.py tests/test_basic.py
      - name: Compare with CPython
        run: python tests/compare_cpython.py

